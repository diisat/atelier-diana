name: Verify portfolio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atelier
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atelier -d atelier"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and package the Java API against PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/atelier
          TEST_DATABASE_USER: atelier
          TEST_DATABASE_PASSWORD: test-password
        run: ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test and build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: Start Java API
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/atelier
          DATABASE_USER: atelier
          DATABASE_PASSWORD: test-password
        run: |
          java -jar backend/target/atelier-1.0.0.jar > /tmp/atelier-api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/actuator/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/atelier-api.log
          exit 1
      - name: Browser journeys
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
